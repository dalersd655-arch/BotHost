services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hosting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hosting_pass}
      POSTGRES_DB: ${POSTGRES_DB:-hosting}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hosting}"]
      interval: 3s
      retries: 20

  panel:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hosting}:${POSTGRES_PASSWORD:-hosting_pass}@db:5432/${POSTGRES_DB:-hosting}
      DATA_DIR: /data
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data

  gate:
    build: .
    restart: unless-stopped
    env_file: .env
    command: python -m app.bot

  # Публичная временная ссылка https://xxxx.trycloudflare.com для теста с телефона:
  #   docker compose --profile tunnel up -d tunnel && docker compose logs tunnel | grep trycloudflare
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://panel:8000
    depends_on: [panel]

volumes:
  pgdata:
